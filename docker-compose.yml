services:
  app:
    build: .
    ports:
      - "8000:80"
    environment: &app-env
      APP_ENV: local
      APP_KEY: ${APP_KEY:?defina APP_KEY no .env (php artisan key:generate --show)}
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: seguros
      DB_USERNAME: seguros
      DB_PASSWORD: ${DB_PASSWORD:-seguros}
      SEGUROS_API_KEY: ${SEGUROS_API_KEY:-troque-esta-chave}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      MAIL_MAILER: ${MAIL_MAILER:-log}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "php artisan migrate --force && apache2-foreground"

  # Executa as tarefas agendadas (aviso diário de vencimento de apólices).
  scheduler:
    build: .
    environment: *app-env
    depends_on:
      - app
    command: php artisan schedule:work

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: seguros
      MYSQL_USER: seguros
      MYSQL_PASSWORD: ${DB_PASSWORD:-seguros}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
